name: Deploy

# Publica cada commit da main que passou no CI: primeiro em homologação, depois em produção
# (produção espera a aprovação configurada no environment "production" do GitHub).
# Também pode ser executado manualmente (Actions > Deploy > Run workflow), por exemplo para
# aplicar uma mudança de configuração feita pelo Terraform.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: Construir imagem
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: meta
        run: echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: smartmaint:${{ steps.meta.outputs.tag }}
          build-args: |
            VITE_APP_VERSION=${{ steps.meta.outputs.tag }}
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  # Para publicar direto em produção (sem ambiente de homologação), crie a variável de
  # repositório DEPLOY_STAGING=false
  staging:
    name: Homologação
    needs: build
    if: vars.DEPLOY_STAGING != 'false'
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: staging
      tag: ${{ needs.build.outputs.tag }}
    permissions:
      contents: read
      id-token: write

  production:
    name: Produção
    needs: [build, staging]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.staging.result == 'success' || needs.staging.result == 'skipped') }}
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: production
      tag: ${{ needs.build.outputs.tag }}
    permissions:
      contents: read
      id-token: write
